<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ali Hardware Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14100b; --bg2:#1e1810; --card:#241c11; --card2:#2c2214;
  --gold:#e8c15a; --gold2:#f5d76e; --golddim:#9c7f3c;
  --txt:#f3ead6; --mut:#c9b48a; --dim:#8d7b58;
  --red:#ff8a7a; --green:#8fe0a8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 50% -10%,#2a2012 0%,var(--bg) 55%) fixed;color:var(--txt);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px}
button{font-family:inherit;cursor:pointer;border:0}
input,textarea,select{font-family:inherit;font-size:16px}
.wrap{position:relative;}
.wrap::before{content:'₹';position:fixed;top:38%;left:50%;transform:translateX(-50%);font-size:340px;font-weight:800;color:rgba(232,193,90,.045);pointer-events:none;z-index:0;font-family:'Baloo 2',sans-serif;}
.wrap>*{position:relative;z-index:1;}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 110px}
header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,rgba(20,16,11,.97),rgba(20,16,11,.88));backdrop-filter:blur(8px);border-bottom:1px solid #3a2e18;padding:14px 0 10px}
.brand{display:flex;align-items:center;gap:10px}
.coin{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#ffe9a8,#d4a83c 55%,#8a6a1e);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 10px rgba(232,193,90,.35);flex:none}
.brand h1{font-size:20px;font-family:'Baloo 2','Poppins',system-ui,sans-serif;font-weight:800;background:linear-gradient(90deg,var(--gold2),var(--gold),#b98d2f);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.3px}
.brand small{display:block;color:var(--dim);font-size:11px;font-weight:400;margin-top:1px}
.view{animation:vin .28s ease}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sumrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 6px}
.sum{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid #3d3018;border-radius:14px;padding:12px 8px;text-align:center;position:relative;overflow:hidden}
.sum::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.sum b{display:block;font-size:18px;color:var(--gold2)}
.sum span{font-size:11px;color:var(--mut)}
.search{width:100%;margin:10px 0;background:var(--bg2);border:1px solid #3d3018;border-radius:12px;padding:12px 14px;color:var(--txt);outline:none}
.search:focus{border-color:var(--golddim)}
.search::placeholder{color:var(--dim)}
.clist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.crow{transition:transform .12s ease,border-color .12s ease;display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid #3d3018;border-radius:14px;padding:12px 14px;width:100%;text-align:left;color:var(--txt);animation:vin .3s ease}
.crow:active{transform:scale(.985);border-color:var(--golddim)}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(140deg,#3a2c12,#241a0a);border:1.5px solid var(--golddim);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold2);font-size:17px;flex:none}
.cinfo{flex:1;min-width:0}
.cname{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:12px;color:var(--dim);margin-top:2px}
.bal{text-align:right;flex:none}
.bal b{font-size:16px}
.bal small{display:block;font-size:10px;color:var(--dim)}
.due{color:var(--red)} .adv{color:var(--green)} .zero{color:var(--dim)}
.empty{text-align:center;color:var(--dim);padding:46px 16px;font-size:14px;line-height:1.7}
.empty .big{font-size:44px;display:block;margin-bottom:10px}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:20;background:linear-gradient(140deg,var(--gold2),#c89a2e);color:#241a05;font-weight:700;font-size:16px;border-radius:50px;padding:15px 22px;box-shadow:0 6px 22px rgba(232,193,90,.45);position:relative;overflow:hidden}
.fab::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s infinite}
@keyframes shine{0%{left:-60%}55%{left:130%}100%{left:130%}}
.back{background:none;color:var(--gold);font-size:15px;padding:6px 4px;margin-top:12px}
.chead{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.chead .avatar{width:52px;height:52px;font-size:21px}
.chead h2{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.balcard{background:linear-gradient(150deg,#33270f,var(--card));border:1px solid var(--golddim);border-radius:16px;padding:18px 16px;text-align:center;margin:10px 0;box-shadow:0 4px 24px rgba(232,193,90,.12), inset 0 1px 0 rgba(245,215,110,.25)}
.balcard .amt{font-size:32px;font-weight:800}
.balcard .lbl{font-size:12px;color:var(--mut);margin-top:2px}
.actrow{display:flex;gap:8px;margin:10px 0}
.actrow button{flex:1;border-radius:12px;padding:13px 6px;font-size:14px;font-weight:600}
.b-ud{background:linear-gradient(140deg,#5a2320,#3a1512);color:#ffb3a8;border:1px solid #7c3630}
.b-jm{background:linear-gradient(140deg,#17401f,#0e2a14);color:#a9e8bc;border:1px solid #2a5c33}
.tx{display:flex;gap:10px;background:var(--bg2);border:1px solid #352a15;border-radius:12px;padding:11px 13px;align-items:center;animation:vin .25s ease}
.tx .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.tx.u .ic{background:#3a1512}.tx.j .ic{background:#0e2a14}
.tx .mid{flex:1;min-width:0}
.tx .note{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .dt{font-size:11px;color:var(--dim);margin-top:2px}
.tx .amt{font-weight:700;font-size:16px;flex:none}
.tx.u .amt{color:var(--red)}.tx.j .amt{color:var(--green)}
.tx .del{background:none;color:var(--dim);font-size:15px;padding:4px 6px;flex:none}
.sec{font-size:12px;color:var(--golddim);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px}
.modal{position:fixed;inset:0;background:rgba(8,6,3,.78);z-index:40;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:linear-gradient(180deg,#241c10,#191308);border:1px solid #4a3a1c;border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:520px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{color:var(--gold2);font-size:17px;margin-bottom:14px;text-align:center}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.field input,.field textarea{width:100%;background:#120d07;border:1px solid #453618;border-radius:11px;padding:13px 14px;color:var(--txt);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--golddim)}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:700;background:#120d07;color:var(--dim);border:1px solid #453618}
.seg button.on-u{background:linear-gradient(140deg,#5a2320,#3a1512);color:#ffb3a8;border-color:#7c3630}
.seg button.on-j{background:linear-gradient(140deg,#17401f,#0e2a14);color:#a9e8bc;border-color:#2a5c33}
.pri{width:100%;background:linear-gradient(140deg,var(--gold2),#c89a2e);color:#241a05;font-weight:700;font-size:16px;border-radius:12px;padding:15px;margin-top:4px}
.ghost{width:100%;background:none;color:var(--dim);padding:12px;margin-top:6px;font-size:14px}
.foot{margin-top:26px;text-align:center;color:var(--dim);font-size:11px;line-height:1.8}
.toolrow{display:flex;gap:8px;margin-top:14px}
.toolrow button{flex:1;background:var(--bg2);border:1px solid #3d3018;color:var(--mut);border-radius:11px;padding:11px 6px;font-size:12.5px}
.wa{background:linear-gradient(140deg,#1fae54,#128c40)!important;color:#fff!important;border:1px solid #2ecc71!important}
.delcust{color:#ff8a7a!important;border-color:#5a2320!important}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2c2214;border:1px solid var(--golddim);color:var(--gold2);padding:11px 20px;border-radius:30px;font-size:14px;z-index:60;display:none;box-shadow:0 6px 20px rgba(0,0,0,.5);white-space:nowrap}
</style>
</head>
<body>
<header><div class="wrap" style="padding-bottom:0">
  <div class="brand">
    <div class="coin">📒</div>
    <h1>Ali Hardware Khata<small>Udhaar-Jama hisaab · Ali Hardware &amp; Electricals</small></h1>
  </div>
</div></header>

<div class="wrap" id="app"></div>

<button class="fab" id="fab" onclick="openCustModal()">+ Naya Grahak</button>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="imp" accept=".json,application/json" style="display:none">

<script>
'use strict';
const LS='ah_khata_v1';
let db={customers:[],tx:[]};
try{const s=localStorage.getItem(LS);if(s){const d=JSON.parse(s);if(d&&d.customers&&d.tx)db=d;}}catch(e){}
function save(){localStorage.setItem(LS,JSON.stringify(db));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function inr(n){n=Math.round(Math.abs(n));return '₹'+n.toLocaleString('en-IN');}
function fdate(ts){const d=new Date(ts),t=new Date();const y=new Date(t);y.setDate(t.getDate()-1);
  const same=(a,b)=>a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear();
  const tm=d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
  if(same(d,t))return 'Aaj, '+tm; if(same(d,y))return 'Kal, '+tm;
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:d.getFullYear()===t.getFullYear()?undefined:'numeric'})+', '+tm;}
function dstr(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function bal(cid){let b=0;for(const t of db.tx){if(t.cid!==cid)continue;b+=t.type==='u'?t.amt:-t.amt;}return b;}
function cust(id){return db.customers.find(c=>c.id===id);}
function lastTx(cid){let m=0;for(const t of db.tx)if(t.cid===cid&&t.ts>m)m=t.ts;return m;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',2200);}
function initials(n){n=(n||'').trim();if(!n)return '?';const p=n.split(/\s+/);return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();}

let view={page:'home',cid:null,q:''};

function render(){
  const app=document.getElementById('app');
  const fab=document.getElementById('fab');
  if(view.page==='home'){fab.style.display='block';app.innerHTML=homeHTML();}
  else{fab.style.display='none';app.innerHTML=custHTML(view.cid);}
}

function homeHTML(){
  let totDue=0,totAdv=0,todayJ=0,todayU=0;
  const today=dstr(Date.now());
  for(const c of db.customers){const b=bal(c.id);if(b>0)totDue+=b;else if(b<0)totAdv+=-b;}
  for(const t of db.tx){if(dstr(t.ts)===today){if(t.type==='j')todayJ+=t.amt;else todayU+=t.amt;}}
  const q=(view.q||'').toLowerCase();
  let list=db.customers.filter(c=>!q||(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q));
  list.sort((a,b)=>{const d=bal(b.id)-bal(a.id);return d!==0?d:lastTx(b.id)-lastTx(a.id);});
  let rows='';
  if(!db.customers.length){
    rows='<div class="empty"><span class="big">🧾</span>Abhi koi grahak nahi.<br><b style="color:var(--gold)">+ Naya Grahak</b> dabao aur pehla khata kholo.<br>Udhaar aur jama ka pura hisaab yahan rahega.</div>';
  }else if(!list.length){
    rows='<div class="empty"><span class="big">🔍</span>"'+esc(view.q)+'" naam ka koi grahak nahi mila.</div>';
  }else{
    for(const c of list){
      const b=bal(c.id);
      const cls=b>0?'due':(b<0?'adv':'zero');
      const lbl=b>0?'baaki':(b<0?'advance':'hisab barabar');
      const lt=lastTx(c.id);
      rows+='<button class="crow" onclick="openCust(\''+c.id+'\')">'
        +'<div class="avatar">'+esc(initials(c.name))+'</div>'
        +'<div class="cinfo"><div class="cname">'+esc(c.name)+'</div><div class="csub">'
        +(c.phone?esc(c.phone)+' · ':'')+(lt?'aakhri entry: '+fdate(lt):'koi entry nahi')+'</div></div>'
        +'<div class="bal"><b class="'+cls+'">'+inr(b)+'</b><small>'+lbl+'</small></div></button>';
    }
  }
  return '<div class="view">'
    +'<div class="sumrow">'
    +'<div class="sum"><b class="due">'+inr(totDue)+'</b><span>Kul baaki lena hai</span></div>'
    +'<div class="sum"><b class="adv">'+inr(todayJ)+'</b><span>Aaj jama aaya</span></div>'
    +'<div class="sum"><b>'+db.customers.length+'</b><span>Grahak</span></div>'
    +'</div>'
    +(totAdv>0?'<div style="font-size:12px;color:var(--dim);text-align:center;margin-bottom:2px">Advance jama: <span class="adv">'+inr(totAdv)+'</span>'+(todayU>0?' · Aaj udhaar diya: <span class="due">'+inr(todayU)+'</span>':'')+'</div>':(todayU>0?'<div style="font-size:12px;color:var(--dim);text-align:center;margin-bottom:2px">Aaj udhaar diya: <span class="due">'+inr(todayU)+'</span></div>':''))
    +'<input class="search" placeholder="🔍 Grahak dhundo (naam ya number)" value="'+esc(view.q||'')+'" oninput="view.q=this.value;render()">'
    +'<div class="clist">'+rows+'</div>'
    +'<div class="toolrow">'
    +'<button onclick="backup()">⬇️ Backup</button>'
    +'<button onclick="document.getElementById(\'imp\').click()">⬆️ Restore</button>'
    +'</div>'
    +'<div class="foot">📱 Sara khata sirf is phone me save hota hai.<br>Chrome me hi kholo · Mahine me ek baar <b>Backup</b> dabao.<br>Ali Hardware &amp; Electricals, Dharni</div>'
    +'</div>';
}

function custHTML(cid){
  const c=cust(cid);
  if(!c){view.page='home';return homeHTML();}
  const b=bal(cid);
  const cls=b>0?'due':(b<0?'adv':'zero');
  const lbl=b>0?'lena baaki hai':(b<0?'advance jama hai':'hisab barabar ✅');
  const txs=db.tx.filter(t=>t.cid===cid).sort((a,b)=>b.ts-a.ts);
  let rows='';
  if(!txs.length)rows='<div class="empty"><span class="big">✍️</span>Abhi koi entry nahi.<br>Upar <b>Udhaar</b> ya <b>Jama</b> dabao.</div>';
  else for(const t of txs){
    rows+='<div class="tx '+t.type+'"><div class="ic">'+(t.type==='u'?'📤':'📥')+'</div>'
      +'<div class="mid"><div class="note">'+(t.note?esc(t.note):(t.type==='u'?'Udhaar':'Jama'))+'</div><div class="dt">'+fdate(t.ts)+'</div></div>'
      +'<div class="amt">'+(t.type==='u'?'+':'−')+inr(t.amt)+'</div>'
      +'<button class="del" onclick="editTx(\''+t.id+'\')" title="Badlo">✏️</button>'
      +'</div>';
  }
  return '<div class="view">'
    +'<button class="back" onclick="goHome()">← Sab grahak</button>'
    +'<div class="chead"><div class="avatar">'+esc(initials(c.name))+'</div><h2>'+esc(c.name)+'</h2>'
    +'<button class="del" style="background:none;color:var(--dim);font-size:18px" onclick="editCust(\''+cid+'\')">⚙️</button></div>'
    +(c.phone?'<div style="font-size:13px;color:var(--dim);margin-top:-4px">📞 '+esc(c.phone)+'</div>':'')
    +'<div class="balcard"><div class="amt '+cls+'">'+inr(b)+'</div><div class="lbl">'+lbl+'</div></div>'
    +'<div class="actrow">'
    +'<button class="b-ud" onclick="openTxModal(\''+cid+'\',\'u\')">📤 Udhaar diya</button>'
    +'<button class="b-jm" onclick="openTxModal(\''+cid+'\',\'j\')">📥 Jama aaya</button>'
    +'</div>'
    +(b>0?'<div class="actrow" style="margin-top:0"><button class="wa" onclick="remind(\''+cid+'\')">💬 WhatsApp pe yaad dilao</button></div>':'')
    +'<div class="sec">Purani entries ('+txs.length+')</div>'
    +'<div class="clist">'+rows+'</div>'
    +'</div>';
}

function goHome(){view.page='home';render();}
function openCust(cid){view.page='cust';view.cid=cid;render();window.scrollTo(0,0);}

// ---------- modals ----------
function closeModal(){document.getElementById('modal').classList.remove('open');}
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open');setTimeout(()=>{const i=document.querySelector('#sheet input');if(i)i.focus();},250);}

function openCustModal(){
  openSheet('<h3>Naya Grahak</h3>'
    +'<div class="field"><label>Naam *</label><input id="f-name" placeholder="Jaise: Ramesh Patil" autocomplete="off"></div>'
    +'<div class="field"><label>Mobile (WhatsApp yaad-dilani ke liye, optional)</label><input id="f-phone" type="tel" inputmode="tel" maxlength="13" placeholder="98xxxxxxxx"></div>'
    +'<button class="pri" onclick="saveCust()">Khata kholo</button>'
    +'<button class="ghost" onclick="closeModal()">Band karo</button>');
}
function saveCust(){
  const n=document.getElementById('f-name').value.trim();
  const p=document.getElementById('f-phone').value.replace(/[^\d+]/g,'');
  if(!n){toast('Naam likhna zaroori hai');return;}
  const c={id:uid(),name:n,phone:p,created:Date.now()};
  db.customers.push(c);save();closeModal();openCust(c.id);toast('Khata khul gaya: '+n);
}
function editCust(cid){
  const c=cust(cid);if(!c)return;
  openSheet('<h3>Grahak badlo</h3>'
    +'<div class="field"><label>Naam</label><input id="f-name" value="'+esc(c.name)+'"></div>'
    +'<div class="field"><label>Mobile</label><input id="f-phone" type="tel" inputmode="tel" maxlength="13" value="'+esc(c.phone||'')+'"></div>'
    +'<button class="pri" onclick="updCust(\''+cid+'\')">Save karo</button>'
    +'<button class="ghost delcust" onclick="delCust(\''+cid+'\')">🗑 Grahak aur pura khata hatao</button>'
    +'<button class="ghost" onclick="closeModal()">Band karo</button>');
}
function updCust(cid){
  const c=cust(cid);if(!c)return;
  const n=document.getElementById('f-name').value.trim();
  const p=document.getElementById('f-phone').value.replace(/[^\d+]/g,'');
  if(!n){toast('Naam khali nahi ho sakta');return;}
  c.name=n;c.phone=p;save();closeModal();render();toast('Save ho gaya');
}
function delCust(cid){
  const c=cust(cid);if(!c)return;
  if(!confirm('"'+c.name+'" ka PURA khata hata dein? Ye wapas nahi aayega.'))return;
  db.tx=db.tx.filter(t=>t.cid!==cid);db.customers=db.customers.filter(x=>x.id!==cid);
  save();closeModal();goHome();toast('Khata hata diya');
}

let txType='u',txEdit=null;
function openTxModal(cid,type,tx){
  txType=type;txEdit=tx||null;
  const t=tx;
  openSheet('<h3>'+(t?'Entry badlo':(type==='u'?'📤 Udhaar diya':'📥 Jama aaya'))+'</h3>'
    +'<div class="seg"><button id="sg-u" class="'+(type==='u'?'on-u':'')+'" onclick="setType(\'u\')">Udhaar</button><button id="sg-j" class="'+(type==='j'?'on-j':'')+'" onclick="setType(\'j\')">Jama</button></div>'
    +'<div class="field"><label>Kitne rupaye? *</label><input id="f-amt" type="number" inputmode="numeric" min="1" placeholder="0" value="'+(t?t.amt:'')+'"></div>'
    +'<div class="field"><label>Kis cheez ka? (optional)</label><input id="f-note" placeholder="Jaise: pipe, cement, paint…" value="'+(t?esc(t.note||''):'')+'"></div>'
    +'<div class="field"><label>Tarikh</label><input id="f-date" type="date" value="'+(t?dstr(t.ts):dstr(Date.now()))+'"></div>'
    +'<button class="pri" onclick="saveTx(\''+cid+'\')">'+(t?'Save karo':'Entry daalo')+'</button>'
    +(t?'<button class="ghost delcust" onclick="delTx(\''+t.id+'\')">🗑 Ye entry hatao</button>':'')
    +'<button class="ghost" onclick="closeModal()">Band karo</button>');
}
function setType(t){
  txType=t;
  document.getElementById('sg-u').className=t==='u'?'on-u':'';
  document.getElementById('sg-j').className=t==='j'?'on-j':'';
}
function saveTx(cid){
  const a=parseInt(document.getElementById('f-amt').value,10);
  const note=document.getElementById('f-note').value.trim();
  const dv=document.getElementById('f-date').value;
  if(!a||a<=0){toast('Rupaye sahi likho');return;}
  let ts=Date.now();
  if(dv){const d=new Date(dv+'T12:00:00');if(!isNaN(d))ts=d.getTime();}
  if(txEdit){txEdit.amt=a;txEdit.note=note;txEdit.type=txType;txEdit.ts=ts;}
  else db.tx.push({id:uid(),cid:cid,type:txType,amt:a,note:note,ts:ts});
  save();closeModal();render();toast(txType==='u'?'Udhaar likh diya':'Jama likh diya');
}
function editTx(tid){
  const t=db.tx.find(x=>x.id===tid);if(!t)return;
  openTxModal(t.cid,t.type,t);
}
function delTx(tid){
  if(!confirm('Ye entry hata dein?'))return;
  db.tx=db.tx.filter(x=>x.id!==tid);save();closeModal();render();toast('Entry hata di');
}

// ---------- WhatsApp reminder ----------
function remind(cid){
  const c=cust(cid);if(!c)return;
  const b=bal(cid);if(b<=0){toast('Baaki kuch nahi hai');return;}
  const msg='Namaste '+c.name+' ji 🙏\nAli Hardware & Electricals, Dharni se yaad-dilani:\nAapka *'+inr(b)+'* ka bhugtaan baaki hai.\nKripya suvidha ke samay jama kar dein.\nDhanyavaad! 🙏';
  let num=(c.phone||'').replace(/\D/g,'');
  if(num.length===10)num='91'+num;else if(num.length===11&&num[0]==='0')num='91'+num.slice(1);
  const url=num.length>=12?('https://wa.me/'+num+'?text='+encodeURIComponent(msg)):('https://wa.me/?text='+encodeURIComponent(msg));
  window.open(url,'_blank');
}

// ---------- backup / restore ----------
function backup(){
  const blob=new Blob([JSON.stringify({app:'ali-hardware-khata',v:1,exported:new Date().toISOString(),customers:db.customers,tx:db.tx},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='ali-hardware-khata-backup-'+dstr(Date.now())+'.json';
  document.body.appendChild(a);a.click();a.remove();
  toast('Backup download ho gaya ⬇️');
}
document.getElementById('imp').addEventListener('change',function(){
  const f=this.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.customers)||!Array.isArray(d.tx))throw 0;
      if(!confirm('Purana khata hata kar backup wala laga dein? ('+d.customers.length+' grahak, '+d.tx.length+' entries)'))return;
      db={customers:d.customers,tx:d.tx};save();goHome();toast('Khata wapas aa gaya ✅');
    }catch(e){toast('Backup file sahi nahi hai');}
  };
  r.readAsText(f);this.value='';
});

render();
</script>
